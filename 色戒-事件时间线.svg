<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2144" viewBox="0 0 1500 2144"><rect width="1500" height="2144" fill="#f8f5ef"/><text x="70" y="55" font-size="34" font-weight="800" fill="#273541">《色，戒》事件时间线</text><text x="72" y="88" font-size="16" fill="#766e67">基于 RawStoryAnalysis · 23 个事件 · 16 条时间约束</text><line x1="145" y1="100" x2="145" y2="2006" stroke="#7a8790" stroke-width="4"/><g><circle cx="145" cy="145" r="10" fill="#4c82ad"/><rect x="173" y="117" width="1050" height="56" rx="10" fill="#dceaf5" stroke="#7899af"/><text x="193" y="139" font-size="15" font-weight="700">v1 · 前史回溯</text><text x="325" y="139" font-size="17">易氏夫妇随汪精卫离开重庆，在香港停留；曾仲鸣遇刺使随行者深居简出。</text><text x="193" y="161" font-size="12" fill="#6b625c">人物：易先生、易太太、汪精卫、曾仲鸣　证据：q33</text></g><g><circle cx="145" cy="228" r="10" fill="#4c82ad"/><rect x="173" y="200" width="1050" height="56" rx="10" fill="#dceaf5" stroke="#7899af"/><text x="193" y="222" font-size="15" font-weight="700">v2 · 前史回溯</text><text x="325" y="222" font-size="17">佳芝在香港参加爱国历史剧公演，演出后与两名女同学乘电车游览。</text><text x="193" y="244" font-size="12" fill="#6b625c">人物：王佳芝　证据：q36</text></g><g><circle cx="145" cy="311" r="10" fill="#4c82ad"/><rect x="173" y="283" width="1050" height="56" rx="10" fill="#dceaf5" stroke="#7899af"/><text x="193" y="305" font-size="15" font-weight="700">v3 · 前史回溯</text><text x="325" y="305" font-size="17">邝裕民向副官打听消息，小集团决定让女生假扮商人少奶奶接近易太太。</text><text x="193" y="327" font-size="12" fill="#6b625c">人物：邝裕民、副官、王佳芝、易太太　证据：q24、q3</text></g><g><circle cx="145" cy="394" r="10" fill="#4c82ad"/><rect x="173" y="366" width="1050" height="56" rx="10" fill="#dceaf5" stroke="#7899af"/><text x="193" y="388" font-size="15" font-weight="700">v4 · 前史回溯</text><text x="325" y="388" font-size="17">黄磊筹款租房借车并扮司机，欧阳灵文扮麦先生，邝裕民扮表弟。</text><text x="193" y="410" font-size="12" fill="#6b625c">人物：黄磊、欧阳灵文、邝裕民、王佳芝　证据：q18、q14</text></g><g><circle cx="145" cy="477" r="10" fill="#4c82ad"/><rect x="173" y="449" width="1050" height="56" rx="10" fill="#dceaf5" stroke="#7899af"/><text x="193" y="471" font-size="15" font-weight="700">v5 · 前史回溯</text><text x="325" y="471" font-size="17">副官引介众人接易太太购物，之后佳芝与易太太单独前往中环。</text><text x="193" y="493" font-size="12" fill="#6b625c">人物：副官、邝裕民、王佳芝、易太太　证据：q14</text></g><g><circle cx="145" cy="560" r="10" fill="#4c82ad"/><rect x="173" y="532" width="1050" height="56" rx="10" fill="#dceaf5" stroke="#7899af"/><text x="193" y="554" font-size="15" font-weight="700">v6 · 前史回溯</text><text x="325" y="554" font-size="17">佳芝首次与易先生同桌打牌，借介绍裁缝留下电话号码；她预期易先生会私下抄号来电，并非已发生的事实。</text><text x="193" y="576" font-size="12" fill="#6b625c">人物：王佳芝、易先生、易太太　证据：q37、q38</text></g><g><circle cx="145" cy="643" r="10" fill="#4c82ad"/><rect x="173" y="615" width="1050" height="56" rx="10" fill="#dceaf5" stroke="#7899af"/><text x="193" y="637" font-size="15" font-weight="700">v7 · 前史回溯</text><text x="325" y="637" font-size="17">黄磊接佳芝返回，众人商议后离开，只留下梁闰生；下文暗示两人发生并重复亲密关系。</text><text x="193" y="659" font-size="12" fill="#6b625c">人物：王佳芝、黄磊、梁闰生　证据：q39、q16、q40</text></g><g><circle cx="145" cy="726" r="10" fill="#4c82ad"/><rect x="173" y="698" width="1050" height="56" rx="10" fill="#dceaf5" stroke="#7899af"/><text x="193" y="720" font-size="15" font-weight="700">v8 · 前史回溯</text><text x="325" y="720" font-size="17">易先生数日未打电话；佳芝联系易太太，随后在约两星期的煎熬后接到易太太辞行电话。</text><text x="193" y="742" font-size="12" fill="#6b625c">人物：王佳芝、易先生、易太太　证据：q40、q41</text></g><g><circle cx="145" cy="809" r="10" fill="#4c82ad"/><rect x="173" y="781" width="1050" height="56" rx="10" fill="#dceaf5" stroke="#7899af"/><text x="193" y="803" font-size="15" font-weight="700">v9 · 前史回溯</text><text x="325" y="803" font-size="17">黄磊负债，家人因舞女同居传闻断绝接济；传闻内容未获确认。</text><text x="193" y="825" font-size="12" fill="#6b625c">人物：黄磊　证据：q19</text></g><g><circle cx="145" cy="892" r="10" fill="#4c82ad"/><rect x="173" y="864" width="1050" height="56" rx="10" fill="#dceaf5" stroke="#7899af"/><text x="193" y="886" font-size="15" font-weight="700">v10 · 前史回溯</text><text x="325" y="886" font-size="17">佳芝与梁闰生关系僵化，并疏远小集团；珍珠港事变后众人转学上海，她未同行，在上海也未与他们来往。</text><text x="193" y="908" font-size="12" fill="#6b625c">人物：王佳芝、梁闰生、邝裕民、黄磊　证据：q17、q42</text></g><g><circle cx="145" cy="975" r="10" fill="#4c82ad"/><rect x="173" y="947" width="1050" height="56" rx="10" fill="#dceaf5" stroke="#7899af"/><text x="193" y="969" font-size="15" font-weight="700">v11 · 前史回溯</text><text x="325" y="969" font-size="17">小集团在上海接触吴，受其鼓励重新找佳芝参与行动。</text><text x="193" y="991" font-size="12" fill="#6b625c">人物：吴、王佳芝、邝裕民　证据：q23、q15</text></g><g><circle cx="145" cy="1058" r="10" fill="#4c82ad"/><rect x="173" y="1030" width="1050" height="56" rx="10" fill="#dceaf5" stroke="#7899af"/><text x="193" y="1052" font-size="15" font-weight="700">v12 · 前史回溯</text><text x="325" y="1052" font-size="17">佳芝与易先生此前在不同公寓见过两次；第一次易先生提出买戒指纪念，第二次未再提。</text><text x="193" y="1074" font-size="12" fill="#6b625c">人物：王佳芝、易先生　证据：q43、q44、q45</text></g><g><circle cx="145" cy="1141" r="10" fill="#c94b42"/><rect x="173" y="1113" width="1050" height="56" rx="10" fill="#f5ded7" stroke="#b86a5b"/><text x="193" y="1135" font-size="15" font-weight="700">v13 · 当前叙事</text><text x="325" y="1135" font-size="17">易太太讲述昨日廖太太请客、偶遇小李夫妇并合席的经过。</text><text x="193" y="1157" font-size="12" fill="#6b625c">人物：易太太、马太太、廖太太、小李　证据：q10</text></g><g><circle cx="145" cy="1224" r="10" fill="#c94b42"/><rect x="173" y="1196" width="1050" height="56" rx="10" fill="#f5ded7" stroke="#b86a5b"/><text x="193" y="1218" font-size="15" font-weight="700">v14 · 当前叙事</text><text x="325" y="1218" font-size="17">易先生进入牌室招呼三名女客；易太太抱怨他未买火油钻，另一位黑斗篷太太和牌打断谈话。</text><text x="193" y="1240" font-size="12" fill="#6b625c">人物：易先生、易太太、王佳芝、马太太　证据：q46、q11、q9</text></g><g><circle cx="145" cy="1307" r="10" fill="#c94b42"/><rect x="173" y="1279" width="1050" height="56" rx="10" fill="#f5ded7" stroke="#b86a5b"/><text x="193" y="1301" font-size="15" font-weight="700">v15 · 当前叙事</text><text x="325" y="1301" font-size="17">易先生趁结算向佳芝暗示门口；佳芝随即声称约了三点谈生意，要求他代打。约会说辞真实性未明。</text><text x="193" y="1323" font-size="12" fill="#6b625c">人物：易先生、王佳芝　证据：q47、q48</text></g><g><circle cx="145" cy="1390" r="10" fill="#c94b42"/><rect x="173" y="1362" width="1050" height="56" rx="10" fill="#f5ded7" stroke="#b86a5b"/><text x="193" y="1384" font-size="15" font-weight="700">v16 · 当前叙事</text><text x="325" y="1384" font-size="17">易太太挽留佳芝；佳芝答应晚上请客，易先生以有事拒绝代打并先离开，佳芝随后脱身。</text><text x="193" y="1406" font-size="12" fill="#6b625c">人物：王佳芝、易先生、易太太　证据：q49、q50、q25</text></g><g><circle cx="145" cy="1473" r="10" fill="#c94b42"/><rect x="173" y="1445" width="1050" height="56" rx="10" fill="#f5ded7" stroke="#b86a5b"/><text x="193" y="1467" font-size="15" font-weight="700">v17 · 当前叙事</text><text x="325" y="1467" font-size="17">佳芝乘易家汽车到咖啡馆，打发司机离开，以响四次再拨的暗号接通邝裕民。</text><text x="193" y="1489" font-size="12" fill="#6b625c">人物：王佳芝、送佳芝的司机、邝裕民　证据：q26、q51、q12</text></g><g><circle cx="145" cy="1556" r="10" fill="#c94b42"/><rect x="173" y="1528" width="1050" height="56" rx="10" fill="#f5ded7" stroke="#b86a5b"/><text x="193" y="1550" font-size="15" font-weight="700">v18 · 当前叙事</text><text x="325" y="1550" font-size="17">佳芝称今天买东西、时间未定，邝裕民表示等她；她挂断电话后叫三轮车。</text><text x="193" y="1572" font-size="12" fill="#6b625c">人物：王佳芝、邝裕民　证据：q52、q53</text></g><g><circle cx="145" cy="1639" r="10" fill="#c94b42"/><rect x="173" y="1611" width="1050" height="56" rx="10" fill="#f5ded7" stroke="#b86a5b"/><text x="193" y="1633" font-size="15" font-weight="700">v19 · 当前叙事</text><text x="325" y="1633" font-size="17">佳芝到静安寺路西摩路口咖啡馆等车，担心行动失败并猜测附近是否有人接应；接应部署未被证实。</text><text x="193" y="1655" font-size="12" fill="#6b625c">人物：王佳芝　证据：q54、q55、q30</text></g><g><circle cx="145" cy="1722" r="10" fill="#c94b42"/><rect x="173" y="1694" width="1050" height="56" rx="10" fill="#f5ded7" stroke="#b86a5b"/><text x="193" y="1716" font-size="15" font-weight="700">v20 · 当前叙事</text><text x="325" y="1716" font-size="17">易先生乘车到达，佳芝上车；他先吩咐司机去上次的公寓。</text><text x="193" y="1738" font-size="12" fill="#6b625c">人物：王佳芝、易先生、接易先生的司机　证据：q27、q28</text></g><g><circle cx="145" cy="1805" r="10" fill="#c94b42"/><rect x="173" y="1777" width="1050" height="56" rx="10" fill="#f5ded7" stroke="#b86a5b"/><text x="193" y="1799" font-size="15" font-weight="700">v21 · 当前叙事</text><text x="325" y="1799" font-size="17">佳芝提出先修耳环，易先生解释迟到是又来了两名访客，并命司机折返。访客为其自述。</text><text x="193" y="1821" font-size="12" fill="#6b625c">人物：王佳芝、易先生、接易先生的司机　证据：q56、q57</text></g><g><circle cx="145" cy="1888" r="10" fill="#c94b42"/><rect x="173" y="1860" width="1050" height="56" rx="10" fill="#f5ded7" stroke="#b86a5b"/><text x="193" y="1882" font-size="15" font-weight="700">v22 · 当前叙事</text><text x="325" y="1882" font-size="17">汽车折返，两人在珠宝店下车入内；印度店员接待，佳芝取出确实缺一粒钻的耳坠。</text><text x="193" y="1904" font-size="12" fill="#6b625c">人物：王佳芝、易先生、接易先生的司机、印度店员　证据：q58、q31、q59</text></g><g><circle cx="145" cy="1971" r="10" fill="#c94b42"/><rect x="173" y="1943" width="1050" height="56" rx="10" fill="#f5ded7" stroke="#b86a5b"/><text x="193" y="1965" font-size="15" font-weight="700">v23 · 当前叙事</text><text x="325" y="1965" font-size="17">易先生主动提出买钻戒纪念，佳芝代问店员；店员向楼上喊话并引两人上楼。</text><text x="193" y="1987" font-size="12" fill="#6b625c">人物：王佳芝、易先生、印度店员　证据：q60、q32</text></g><circle cx="90" cy="2089" r="8" fill="#4c82ad"/><text x="108" y="2094" font-size="14">前史回溯</text><circle cx="230" cy="2089" r="8" fill="#c94b42"/><text x="248" y="2094" font-size="14">当前叙事</text><text x="430" y="2094" font-size="14" fill="#777">时间顺序依据模型抽取的 before 约束；未确定关系未强行排序</text></svg>